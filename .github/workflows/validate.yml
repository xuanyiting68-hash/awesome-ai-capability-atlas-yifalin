name: Validate atlas data and scripts
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate site JavaScript syntax and curated data
        run: python scripts/check_site.py
      - name: Validate resource data and source
        run: |
          python -m py_compile scripts/harvest.py scripts/test_harvest.py scripts/harvest_multi.py scripts/test_multi.py
          python -m unittest discover -s scripts -p 'test_*.py'
          python - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('data/curated.json').read_text('utf-8'))
          assert len(rows)==133, len(rows)
          assert len({r['url'] for r in rows}) == 133
          growth={'AI视频制作','自媒体运营','智能获客','客户关系维护','增长分析'}
          assert sum(r.get('topic') in growth for r in rows)==40
          print('PASS: 133 unique curated records / 40 growth records')
          PY

  browser:
    runs-on: ubuntu-24.04
    env:
      ATLAS_BROWSER_CHANNEL: chrome
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked browser test dependency
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify runner-provided Chrome
        run: google-chrome --version
      - name: Verify research workspace in a real browser
        run: npm run test:e2e
      - name: Verify staged Pages artifact
        run: npm run test:staged
      - name: Preserve screenshots on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-browser-screenshots
          path: test-results/
          if-no-files-found: ignore
