name: Validate Atlas research lab
on:
  pull_request:
    paths:
      - 'top30.html'
      - 'project.html'
      - 'blueprints.html'
      - 'data/business_use_cases.json'
      - 'index.html'
      - 'data/top30_evaluation.csv'
      - 'data/top30_en.json'
      - 'tests/**'
      - 'package*.json'
      - 'data/repo_metadata.json'
      - 'data/top30_evidence.json'
      - 'scripts/build_top30_evidence.py'
      - 'scripts/test_top30_evidence.py'
      - 'scripts/test_top30_contract.py'
      - '.github/workflows/repo-metadata.yml'
      - '.github/workflows/validate-top30.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Top 30 CSV, page, and metadata consistency
        run: python -m unittest discover -s scripts -p 'test_top30_contract.py' -v
      - name: Verify deterministic evidence generation
        run: |
          python scripts/build_top30_evidence.py
          git diff --exit-code -- data/top30_evidence.json
      - name: Verify evidence gate tests
        run: python -m unittest discover -s scripts -p 'test_top30_evidence.py' -v
      - name: Verify inline JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          for name in ['top30.html', 'project.html', 'blueprints.html']:
              text = Path(name).read_text('utf-8')
              js = re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>', text, re.S)
              assert len(js) == 1, f'{name}: expected one inline script'
              Path('/tmp/' + name + '.js').write_text(js[0], encoding='utf-8')
          PY
          node --check /tmp/top30.html.js
          node --check /tmp/project.html.js
          node --check /tmp/blueprints.html.js
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser scenarios — catalog, Top 30, detail, blueprints
        run: npm run test:e2e
      - name: Upload browser screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-e2e-failure
          path: test-results/
          if-no-files-found: ignore
