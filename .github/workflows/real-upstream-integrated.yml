name: Verify cross-tool Docling + LangGraph + Promptfoo (isolated)
on:
  pull_request:
    paths:
      - 'scripts/real_integrated_pipeline.py'
      - 'scripts/test_real_integrated_pipeline.py'
      - 'scripts/verify_integrated_pipeline.cjs'
      - '.github/workflows/real-upstream-integrated.yml'
      - 'docs/REAL_UPSTREAM_INTEGRATED_E2E_CN.md'
      - 'pilot-lab.html'
      - 'README.md'
  push:
    branches: [main]
    paths:
      - 'scripts/real_integrated_pipeline.py'
      - 'scripts/test_real_integrated_pipeline.py'
      - 'scripts/verify_integrated_pipeline.cjs'
      - '.github/workflows/real-upstream-integrated.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrated-synthetic-upstreams:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
      PROMPTFOO_DISABLE_TELEMETRY: 'true'
      PROMPTFOO_DISABLE_UPDATE: 'true'
      DO_NOT_TRACK: '1'
      NPM_CONFIG_IGNORE_SCRIPTS: 'true'
      NPM_CONFIG_AUDIT: 'false'
      NPM_CONFIG_FUND: 'false'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Python upstream SDK wheels only
        run: |
          python -m pip install --only-binary=:all: --no-cache-dir 'docling==2.144.0' 'langgraph==1.2.18'
      - name: Install pinned Promptfoo upstream CLI without install scripts
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/promptfoo" 'promptfoo@0.125.1'
      - name: Preserve actual upstream resolved versions and package identity
        run: |
          python -m pip freeze --all > test-results-python-dependencies.txt
          node -p "require(process.env.RUNNER_TEMP+'/promptfoo/node_modules/promptfoo/package.json').version" > test-results-promptfoo-version.txt
      - name: Execute REAL Docling PDF conversion INSIDE LangGraph checkpoints and mock approval
        run: |
          python scripts/real_integrated_pipeline.py --outdir test-results/integrated
      - name: Independently re-execute upstream PDF and state-graph scenarios
        run: |
          python -m unittest scripts.test_real_integrated_pipeline -v
      - name: Run actual Promptfoo evaluator on generated graph outcomes
        run: |
          "$RUNNER_TEMP/promptfoo/node_modules/.bin/promptfoo" eval -c test-results/integrated/echo-positive.yaml --no-cache --no-share --no-table -o test-results/integrated/echo-result-positive.json
      - name: Run one deliberate evaluation failure and preserve the negative output
        run: |
          set +e
          "$RUNNER_TEMP/promptfoo/node_modules/.bin/promptfoo" eval -c test-results/integrated/echo-negative.yaml --no-cache --no-share --no-table -o test-results/integrated/echo-result-negative.json
          rc=$?
          set -e
          echo "Expected negative-control exit status: $rc"
          test -f test-results/integrated/echo-result-negative.json
      - name: Independently verify real results are derived from same PDF-graph run
        run: |
          node scripts/verify_integrated_pipeline.cjs
      - name: Preserve original synthetic-only cross-tool evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-integrated-docling-langgraph-promptfoo-evidence
          path: |
            test-results/integrated/
            test-results-python-dependencies.txt
            test-results-promptfoo-version.txt
          if-no-files-found: warn
          retention-days: 30
