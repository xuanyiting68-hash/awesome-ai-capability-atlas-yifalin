name: Publish atlas to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate committed data before publication
        run: |
          python scripts/check_site.py
          python -m unittest discover -s scripts -p 'test_*.py'
      - name: Stage public assets and deployment manifest
        run: python scripts/build_site.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - id: deployment
        uses: actions/deploy-pages@v4

  verify-online:
    needs: deploy
    uses: ./.github/workflows/monitor-site.yml
    with:
      expected_commit: ${{ github.sha }}
    permissions:
      contents: read
