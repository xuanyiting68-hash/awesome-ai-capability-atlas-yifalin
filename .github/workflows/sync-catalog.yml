name: Sync public capability catalog
on:
  workflow_dispatch:
  schedule:
    - cron: '21 3 * * 1'
permissions:
  contents: write
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate parser
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Sync source index without executing third-party code
        run: python scripts/harvest.py
      - name: Commit source snapshot when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalog.json data/catalog.csv data/provenance.json data/excluded.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh unreviewed public source index'
            git push
          fi
