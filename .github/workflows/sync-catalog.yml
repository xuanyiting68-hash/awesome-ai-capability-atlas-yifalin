name: Sync public capability catalog
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/harvest.py'
      - 'scripts/harvest_multi.py'
      - 'data/curated.json'
      - '.github/workflows/sync-catalog.yml'
  schedule:
    - cron: '21 3 * * 1'
permissions:
  contents: write
  actions: write
concurrency:
  group: atlas-data-refresh
  cancel-in-progress: false
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate parser
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Sync multi-ecosystem public source indexes without executing third-party code
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/harvest_multi.py
      - name: Commit verified public snapshot and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalog.json data/catalog.csv data/provenance.json data/excluded.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh unreviewed public source index'
            git pull --rebase origin main
            git push origin HEAD:main
            gh workflow run pages.yml --ref main
          fi
