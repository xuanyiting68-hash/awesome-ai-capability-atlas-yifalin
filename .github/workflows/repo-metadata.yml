name: Enrich curated GitHub metadata
on:
  workflow_dispatch:
  schedule:
    - cron: '34 2 * * 3'
  push:
    branches: [main]
    paths:
      - 'scripts/sync_repo_metadata.py'
      - '.github/workflows/repo-metadata.yml'
permissions:
  contents: write
concurrency:
  group: atlas-metadata
  cancel-in-progress: false
jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Sync public GitHub repository metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sync_repo_metadata.py
      - name: Commit verified metadata snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/repo_metadata.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh curated repository metadata'
            git push
          fi
