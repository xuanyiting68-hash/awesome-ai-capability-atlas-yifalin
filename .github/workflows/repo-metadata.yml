name: Enrich curated GitHub metadata
on:
  workflow_dispatch:
  schedule:
    - cron: '34 2 * * 3'
  pull_request:
    paths:
      - '.github/workflows/repo-metadata.yml'
      - 'scripts/sync_repo_metadata.py'
      - 'scripts/build_top30_evidence.py'
      - 'scripts/test_metadata.py'
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: atlas-data-refresh
  cancel-in-progress: false
jobs:
  enrich:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Sync public GitHub repository metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sync_repo_metadata.py
      - name: Refresh Top 30 evidence from latest repository metadata
        run: python scripts/build_top30_evidence.py
      - name: Verify generated evidence invariants
        run: python -m unittest discover -s scripts -p 'test_top30_evidence.py' -v
      - name: Preserve generated evidence for review even if GitHub branch rules deny pushes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-metadata-refresh-review-candidate
          path: |
            data/repo_metadata.json
            data/top30_evidence.json
          retention-days: 30
          if-no-files-found: error
      - name: Open draft source refresh PR instead of forbidden direct main push
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/repo_metadata.json data/top30_evidence.json
          if git diff --cached --quiet; then
            echo 'No changes in the verified public metadata snapshot.'
            exit 0
          fi
          branch="data/metadata-refresh-$GITHUB_RUN_ID"
          git switch -c "$branch"
          git commit -m 'data: propose verified public repository metadata refresh'
          # Any protected-branch rejection must remain a visible failure; the artifact is still safe.
          git push origin HEAD:"refs/heads/$branch"
          gh pr create --base main --head "$branch" --draft --title "Data review: refreshed public repo metadata" --body "Automated, review-only public metadata update. Never merge without checking evidence freshness, source count (133), Top 30 snapshot coupling, CI and branch rules. GitHub Action bot has not approved safety or software licenses."
