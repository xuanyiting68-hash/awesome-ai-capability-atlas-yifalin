name: Enrich curated GitHub metadata
on:
  workflow_dispatch:
  schedule:
    - cron: '34 2 * * 3'
  push:
    branches: [main]
    paths:
      - 'scripts/sync_repo_metadata.py'
      - 'scripts/build_top30_evidence.py'
      - 'data/top30_evaluation.csv'
      - '.github/workflows/repo-metadata.yml'
permissions:
  contents: write
  actions: write
concurrency:
  group: atlas-data-refresh
  cancel-in-progress: false
jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Sync public GitHub repository metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sync_repo_metadata.py
      - name: Refresh Top 30 evidence from latest repository metadata
        run: python scripts/build_top30_evidence.py
      - name: Verify generated evidence invariants
        run: python -m unittest discover -s scripts -p 'test_top30_evidence.py' -v
      - name: Commit verified metadata snapshot and request website refresh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/repo_metadata.json data/top30_evidence.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh curated repository metadata'
            git pull --rebase origin main
            git push origin HEAD:main
            gh workflow run pages.yml --ref main
          fi
