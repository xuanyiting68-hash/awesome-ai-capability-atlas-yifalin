name: Industry AI Atlas V1.7 (isolated validation)
on:
  pull_request:
    paths:
      - 'industry-atlas/**'
      - '.github/workflows/industry-atlas-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: industry-ai-atlas-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate frozen source and career contracts
        working-directory: industry-atlas
        run: |
          python validate.py
          python check_workflows.py
          python validate_career.py
          python -m unittest -v test_discovery_review test_discovery_lifecycle test_provider_contract_v174 test_rag_retrieval_v175 test_source_governance_v176 test_evidence_eval_v176 test_safe_provider_policy_v176 test_coverage_review_v177 test_sector_gap_briefs_v178 test_external_leads_v179 test_license_evidence_v180 test_source_monitor_v180 test_supply_chain_review_v181 test_supply_chain_tree_monitor_v181
          python discovery_review.py --mode offline --limit 80 --output /tmp/yifalin_discovery_offline.json
          python discovery_lifecycle.py --current /tmp/yifalin_discovery_offline.json --output /tmp/yifalin_discovery_delta.json
          python build_advisor_v15.py
          git diff --exit-code -- advisor.html advisor_v15_data.json
          python patch_advisor_v16.py
          python build_advisor_v16.py
          git diff --exit-code -- advisor_v16_template.html advisor_v16.html advisor_v16_data.json
          python build_advisor_v17.py
          git diff --exit-code -- advisor_v17.html
          python build_advisor_v173.py
          git diff --exit-code -- advisor_v173.html
          python build_advisor_v174.py
          git diff --exit-code -- advisor_v174.html
          python build_advisor_v175.py
          git diff --exit-code -- advisor_v175.html
          python build_advisor_v176.py
          git diff --exit-code -- advisor_v176.html
          python build_advisor_v177.py
          git diff --exit-code -- advisor_v177.html
          python build_advisor_v178.py
          git diff --exit-code -- advisor_v178.html
          python build_advisor_v179.py
          git diff --exit-code -- advisor_v179.html
          python build_advisor_v180.py
          git diff --exit-code -- advisor_v180.html
          python build_advisor_v181.py
          git diff --exit-code -- advisor_v181.html
          python supply_chain_review_v181.py --output /tmp/yifalin_supply_chain_review_v181.json
          python supply_chain_tree_monitor_v181.py --mode offline --as-of 2026-11-04T09:00:00Z --output /tmp/yifalin_tree_monitor_offline_v181.json
          python license_evidence_v180.py --output /tmp/yifalin_license_evidence_v180.json
          python source_monitor_v180.py --mode offline --as-of 2026-11-04T08:45:00Z --output /tmp/yifalin_monitor_offline_v180.json
          python external_leads_v179.py --output /tmp/yifalin_external_review_v179.json
          python sector_gap_briefs_v178.py --output /tmp/yifalin_sector_gap_briefs_v178.json
          python coverage_review_v177.py --output /tmp/yifalin_coverage_review_v177.json
          python source_governance_v176.py --as-of 2026-11-04 --output /tmp/yifalin_source_governance_v176.json
          python evidence_eval_v176.py
      - name: Install pinned Playwright and Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Offline browser regressions
        working-directory: industry-atlas
        run: |
          python check.py
          python check_expert.py
          python check_career.py
          python check_taxonomy_v13.py
          python check_discover_v14.py
          python check_advisor_v15.py
          python check_advisor_v16.py
          python check_advisor_v17.py
          python check_advisor_v173.py
          python check_advisor_v174.py
          python check_advisor_v175.py
          python check_advisor_v176.py
          python check_advisor_v177.py
          python check_advisor_v178.py
          python check_advisor_v179.py
          python check_advisor_v180.py
          python check_advisor_v181.py
          python check_start_task_first.py
          python check_intelligence_ui.py
