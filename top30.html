function renderComparison(){const chosen=rows.filter(r=>selected.has(r.github_repository));$('comparePanel').hidden=!chosen.length;if(!chosen.length){$('compareContent').textContent='';return}const dims=[['project',r=>r.github_repository],['domain',r=>domainName(r.domain)],['capability',r=>textFor(r,'capability')],['pilot',r=>textFor(r,'yifalin_pilot')],['priority',r=>r.research_priority],['stars',r=>formatNum(metadata(r)?.stars)],['Forks',r=>formatNum(metadata(r)?.forks)],['GitHub SPDX',r=>metadata(r)?.license_spdx||t('unknown')],['Push',r=>metadata(r)?.last_push?.slice(0,10)||t('unknown')],['licenseReview',()=>t('notReviewed')],['securityReview',()=>t('notAudited')],['repro',()=>t('notTested')],['fork',r=>record(r)?.fork_decision||'HOLD']];$('compareContent').innerHTML='<table><caption>'+esc(t('comparison'))+'</caption><thead><tr><th scope="col">'+esc(t('capability'))+'</th>'+chosen.map(r=>'<th scope="col">'+esc(r.github_repository)+'<br><button type="button" data-remove="'+esc(r.github_repository)+'">'+esc(t('remove'))+'</button></th>').join('')+'</tr></thead><tbody>'+dims.map(([label,fn])=>'<tr><th scope="row">'+esc(COPY[lang][label]||label)+'</th>'+chosen.map(r=>'<td>'+esc(fn(r))+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}
function render(){renderComparison();const q=$('search').value.trim().toLowerCase(),domain=$('domain').value,priority=$('priority').value,status=$('status').value,lic=$('license').value,maint=$('maintenance').value;visible=rows.filter(r=>(!q||[r.github_repository,r.capability,r.domain,DOMAINS[r.domain],r.yifalin_pilot,english[r.github_repository.toLowerCase()]?.capability,english[r.github_repository.toLowerCase()]?.yifalin_pilot].join(' ').toLowerCase().includes(q))&&(!domain||r.domain===domain)&&(!priority||r.research_priority===priority)&&(!status||r.validation_status===status)&&(!lic||(lic==='detected'?detected(metadata(r)):!detected(metadata(r))))&&(!maint||(maint==='recent'?recent(metadata(r)):!recent(metadata(r))))&&(!$('favorites').checked||favoriteIds.has(bookmarkId(r))));visible.sort((a,b)=>$('sort').value==='name'?a.github_repository.localeCompare(b.github_repository):$('sort').value==='stars'?(metadata(b)?.stars??-1)-(metadata(a)?.stars??-1)||Number(a.rank)-Number(b.rank):Number(a.rank)-Number(b.rank));$('total').textContent=rows.length;$('domains').textContent=new Set(rows.map(r=>r.domain)).size;$('savedTotal').textContent=rows.filter(r=>favoriteIds.has(bookmarkId(r))).length;$('count').textContent=ready?t('count').replace('{n}',visible.length).replace('{total}',rows.length).replace('{time}',metadataTime||t('unknown')):t('loading');$('notices').textContent=[...notices].map(t).join(' ');$('export').disabled=!ready||!visible.length;$('results').innerHTML=visible.length?visible.map(r=>{const m=metadata(r);return '<article class="item" id="project-'+Number(r.rank)+'"><div class="badge-line"><span class="rank-mark">#'+esc(r.rank)+'</span><span class="pill">'+esc(domainName(r.domain))+' · '+esc(r.research_priority)+'</span></div><h2>'+esc(r.github_repository)+'</h2><p>'+esc(textFor(r,'capability'))+'</p><p><strong>'+esc(t('pilot'))+': </strong>'+esc(textFor(r,'yifalin_pilot'))+'</p><p><strong>'+esc(t('metadata'))+': </strong>'+esc(m?('★ '+formatNum(metadata(r).stars)+' · Forks '+formatNum(m.forks)+' · SPDX '+(metadata(r).license_spdx||t('unknown'))+' · Push '+(m.last_push||t('unknown')).slice(0,10)+(m.archived?' · '+t('archived'):'')):t('noMeta'))+'</p><div class="topline"><span class="pill pending">'+esc(t('notTested'))+'</span><span class="pill pending">'+esc(t('licensePending'))+'</span><span class="pill pending">'+esc(t('securityPending'))+'</span></div><details class="evidence"><summary>'+esc(t('evidence'))+'</summary>'+evidenceHTML(r)+'</details><div class="actions"><button class="favorite-button" type="button" data-favorite="'+esc(r.github_repository)+'" aria-pressed="'+favoriteIds.has(bookmarkId(r))+'">'+esc(t(favoriteIds.has(bookmarkId(r))?'saved':'save'))+'</button><button class="compare-button" type="button" data-repo="'+esc(r.github_repository)+'" aria-pressed="'+selected.has(r.github_repository)+'">'+esc(t(selected.has(r.github_repository)?'selected':'addCompare'))+'</button><a href="./project.html?repo='+encodeURIComponent(r.github_repository)+'">项目详情 / Details ↗</a><a href="'+esc(r.url)+'" target="_blank" rel="noopener noreferrer">'+esc(t('github'))+'</a></div></article>'}).join(''):(ready?'<div class="empty">'+esc(t('empty'))+'</div>':'')}
function csvCell(value){let s=String(value??'');if(/^[\s\uFEFF]*[=+@-]|^[\t\r\n]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}
function exportCSV(){const out=[headers,...visible.map(r=>headers.map(h=>r[h]??''))].map(row=>row.map(csvCell).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob(['\ufeff'+out],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='yifalin-top30-filtered.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function fetchJSON(url){const res=await fetch(url,{cache:'no-cache'});if(!res.ok)throw Error('HTTP '+res.status);return res.json()}
async function loadMetadata(){try{const obj=await fetchJSON('./data/repo_metadata.json');if(!obj.repositories||Array.isArray(obj.repositories)||typeof obj.repositories!=='object')throw Error('invalid metadata');meta=obj.repositories;metadataTime=obj.generated_at_utc||''}catch{metadataTime='';notices.add('metaFailed')}}
async function loadEvidence(){try{const obj=await fetchJSON('./data/top30_evidence.json');if(!Array.isArray(obj.projects)||obj.projects.length!==rows.length)throw Error('invalid evidence');if(metadataTime&&obj.generated_from_snapshot_utc!==metadataTime){notices.add('staleEvidence');return}const map=Object.create(null);for(const r of rows){const matches=obj.projects.filter(e=>e.repo?.toLowerCase()===r.github_repository.toLowerCase());if(matches.length!==1)throw Error('missing or duplicate evidence');const e=matches[0];if(e.fork_decision!=='HOLD'||e.license_text_review!=='not-reviewed'||e.dependency_license_review!=='not-reviewed'||e.security_review!=='not-audited'||e.reproducibility!=='not-tested'||e.sandbox_commit_sha!==null)throw Error('unsupported review state');map[e.repo.toLowerCase()]=e}evidence=map;evidenceTime=obj.generated_from_snapshot_utc||t('unknown')}catch{notices.add('evidenceMissing')}}
async function start(){localize();try{const response=await fetch('./data/top30_evaluation.csv',{cache:'no-cache'});if(!response.ok)throw Error();const table=parseCSV((await response.text()).replace(/^\uFEFF/,''));headers=table.shift();const required=['rank','github_repository','domain','capability','yifalin_pilot','validation_status','license_status','security_status','fork_decision'];if(!required.every(h=>headers.includes(h)))throw Error('Data format unexpected');if(table.some(r=>r.length!==headers.length))throw Error('Malformed row');rows=table.map(r=>Object.fromEntries(headers.map((h,i)=>[h,r[i]])));if(rows.length!==30||new Set(rows.map(r=>r.github_repository.toLowerCase())).size!==30||new Set(rows.map(r=>r.rank)).size!==30)throw Error('Invalid project count');for(const r of rows){if(!/^[A-Za-z0-9_-][A-Za-z0-9_.-]*\/[A-Za-z0-9_-][A-Za-z0-9_.-]*$/.test(r.github_repository)||r.url!=='https://github.com/'+r.github_repository||!/^([1-9]|[12][0-9]|30)$/.test(r.rank))throw Error('Invalid project URL');if(r.validation_status!=='not-tested'||r.license_status!=='not-reviewed'||r.security_status!=='not-audited'||r.fork_decision!=='hold-until-license-and-sandbox-validation')throw Error('Unsupported review state')}await Promise.all([loadMetadata(),fetchJSON('./data/top30_en.json').then(o=>{english=o}).catch(()=>notices.add('translationFailed'))]);await loadEvidence();localize();fields.forEach(id=>{if(params.has(id))$(id).value=params.get(id)});for(const repo of (params.get('compare')||'').split(',')){if(selected.size<4&&rows.some(r=>r.github_repository===repo))selected.add(repo)}ready=true;render();syncURL()}catch{$('count').textContent=t('failed');$('results').innerHTML='<button type="button" id="retry">'+esc(t('retry'))+'</button>';$('retry').addEventListener('click',()=>location.reload());$('export').disabled=true}}
fields.forEach(id=>$(id).addEventListener(id==='search'?'input':'change',()=>{render();syncURL()}));$('favorites').addEventListener('change',render);$('export').addEventListener('click',exportCSV);$('clearCompare').addEventListener('click',()=>{selected.clear();render();syncURL()});$('compareContent').addEventListener('click',e=>{const b=e.target.closest('[data-remove]');if(b)toggleCompare(b.dataset.remove)});$('results').addEventListener('click',e=>{const b=e.target.closest('button');if(b?.dataset.repo)toggleCompare(b.dataset.repo);if(b?.dataset.favorite)toggleFavorite(b.dataset.favorite)});$('reset').addEventListener('click',()=>{fields.forEach(id=>$(id).value=id==='sort'?'rank':'');$('favorites').checked=false;$('feedback').textContent='';render();syncURL()});$('language').addEventListener('click',()=>{lang=lang==='zh'?'en':'zh';localize();syncURL()});$('share').addEventListener('click',async()=>{syncURL();try{await navigator.clipboard.writeText(location.href);$('feedback').textContent=t('shared')}catch{$('feedback').textContent=t('shareReady')}});window.addEventListener('storage',e=>{if(e.key==='atlas_favorites_v1'){try{const ids=JSON.parse(e.newValue||'[]');if(Array.isArray(ids))favoriteIds=new Set(ids.filter(v=>typeof v==='string'));render()}catch{}}});start();
</script></body></html>
