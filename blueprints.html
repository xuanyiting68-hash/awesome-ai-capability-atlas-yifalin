<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Business Blueprints | YIFALIN Capability Atlas</title>
<style>:root{font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;background:#f3f6fc;color:#192d47}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(120deg,#101f3c,#243d78);color:#fff;padding:44px max(22px,calc((100vw - 1180px)/2))}header a{color:#bfdafe}h1{font-size:clamp(27px,4vw,43px);margin:18px 0 12px}header p{color:#d2dff1;max-width:800px;line-height:1.8}main{max-width:1220px;padding:24px;margin:auto}.notice{border:1px solid #d9e4f4;border-radius:12px;background:white;padding:14px 18px;color:#526784;font-size:13px;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:20px}.card{background:#fff;border:1px solid #e2e8f4;border-radius:15px;padding:22px}.card h2{font-size:21px;margin:0 0 11px}.card p{font-size:13px;line-height:1.75;color:#526783}.stages{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.stage{background:#edf2ff;border:1px solid #d9e5fb;color:#304e91;padding:11px;border-radius:9px;font-size:12px;line-height:1.5;flex:1 1 135px}.arrow{align-self:center;color:#7890ad}.label{font-weight:800;color:#172c49;font-size:12px}.risk{background:#fff4e7;border-radius:9px;padding:12px;color:#815b2e!important}a{color:#3457bf}select{padding:11px 12px;border-radius:10px;border:1px solid #d1dded}footer{padding:30px;color:#708198;font-size:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}.card{padding:17px}}</style></head><body>
<header><a href="./index.html">◈ YIFALIN Atlas 首页</a> · <a href="./top30.html">Top 30 项目研究室</a><h1>AI 业务能力组合蓝图</h1><p>从单个开源工具进入真实业务场景：查看工作流、可衡量目标与关键风险。本页面展示的是研究设计，不代表已经完成端到端系统集成、商业授权或真实部署。</p></header>
<main><div class="notice"><label for="domain">业务领域：</label> <select id="domain"><option value="">全部领域</option></select> <span id="count" role="status">正在载入案例…</span><p>所有流程均为编辑方案（illustrative blueprint）；执行前须核验每个项目的许可证、数据边界、接口授权和真实成本。</p></div><section class="grid" id="cards" aria-label="业务能力蓝图"></section><footer>来源：<a href="./data/business_use_cases.json">业务案例数据</a> · <a href="./docs/BLUEPRINTS_CN.md">六大技术架构蓝图</a> · <a href="./top30.html">可比较的项目研究队列</a></footer></main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const escapeHTML=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let domains={};
function render(){const filter=$('domain').value;const entries=Object.entries(domains).filter(([name])=>!filter||name===filter);$('count').textContent=' · '+entries.length+' 个场景';$('cards').innerHTML=entries.map(([name,c])=>'<article class="card"><h2>'+escapeHTML(name)+'</h2><p>'+escapeHTML(c.goal)+'</p><div class="stages">'+c.flow.map((step,index)=>'<div class="stage"><span class="label">STEP '+(index+1)+'</span><div>'+escapeHTML(step)+'</div></div>').join('')+'</div><p><span class="label">验证指标：</span>'+escapeHTML(c.metric)+'</p><p class="risk"><span class="label">风险边界：</span>'+escapeHTML(c.risk)+'</p><a href="./top30.html?domain='+encodeURIComponent(name)+'">查看相关 Top 30 项目 ↗</a></article>').join('')}
async function start(){try{const r=await fetch('./data/business_use_cases.json',{cache:'no-cache'});if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();if(data.status!=='illustrative-blueprints-not-tested'||!data.domains||typeof data.domains!=='object')throw Error('数据格式或审核状态不符');for(const [name,c] of Object.entries(data.domains)){if(!c.goal||!c.metric||!c.risk||!Array.isArray(c.flow)||c.flow.length<3)throw Error('不完整的场景：'+name)}domains=data.domains;for(const name of Object.keys(domains)){const opt=document.createElement('option');opt.value=name;opt.textContent=name;$('domain').append(opt)}const selected=new URLSearchParams(location.search).get('domain');if(domains[selected])$('domain').value=selected;render()}catch(error){$('count').textContent='案例加载失败：'+error.message}}
$('domain').addEventListener('change',render);start();
</script></body></html>
